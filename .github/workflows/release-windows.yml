name: Rilis Windows

# Jalankan manual dari tab Actions. Membuat installer .exe, menandatanganinya untuk update otomatis,
# lalu menerbitkannya di Releases dengan nama versi dari src-tauri/tauri.conf.json.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Luna Finance v__VERSION__
          releaseBody: Unduh file .exe di bawah, lalu jalankan. Data kamu tidak terhapus saat memperbarui.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
